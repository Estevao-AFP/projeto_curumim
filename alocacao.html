<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Alocar Recursos</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style_sidebar.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />

    <script src="js/script.js"></script>
    <script src="js/scriptAlocacao.js"></script>
</head>

<body>

    <div class="wrapper">

        <nav id="sidebar">

            <div class="sidebar-header">
                <img class="logo" src="img/download-removebg-preview.png" alt="">
                <h3>Projeto Curumim</h3>
            </div>

            <ul class="list-unstyled components">

                <p>Navegar>>></p>

                <li>
                    <a href="index.html">Página inicial</a>
                </li>

                <li>
                    <a href="doar.html">Doar agora</a>
                </li>

                <li>
                    <a href="projetos.html">Cadastrar projetos</a>
                </li>

                <li>
                    <a href="organizadores.html">Cadastrar organizadores</a>
                </li>

                <li>
                    <a href="materiais.html">Cadastrar materiais</a>
                </li>

                <li class="active">
                    <a href="alocacao.html">Alocar recursos</a>
                </li>

                <!-- <li>
                    <a href="doacoes.html">Gerenciar doações</a>
                </li> -->

            </ul>

        </nav>

        <div id="content">

            <nav class="navbar navbar-default">

                <div class="container-fluid navbar-flex">

                    <button type="button" id="sidebarCollapse" class="btn btn-info navbar-btn"
                        style="background-color:#A71E1E; border:none;">

                        <i class="glyphicon glyphicon-align-left"></i>

                    </button>

                    <div class="btn-centro">

                        <button
                            style="background-color:transparent; border:none; font-size:18px; color:#A71E1E; font-weight:bold;">

                            Alocar Recursos

                        </button>

                    </div>

                    <div class="nav-direita">
                        <img class="logo" src="img/download-removebg-preview.png" alt="">
                    </div>

                </div>

            </nav>



            <form id="formMateriais">

                <h4 style="font-weight:bold;">Alocar Recursos</h4>

                <fieldset>

                    <label for="materiais">Material</label>

                    <select id="materiais">

                        <option>Salão de Eventos</option>
                        <option>Equipamentos de Som</option>
                        <option>Material de Apoio</option>

                    </select>

                </fieldset>

                <fieldset>

                    <label for="projetoMaterial">Projeto</label>

                    <select id="projetoMaterial">

                        <option>Selecione um projeto</option>
                        <option>Artesanato</option>
                        <option>Cuido de mim</option>
                        <option>Gerações</option>

                    </select>

                </fieldset>

                <fieldset>

                    <label for="quantidade_necessaria">Quantidade Necessária</label>

                    <input id="quantidade_necessaria" name="quantidade_necessaria" type="number"
                        placeholder="Quantidade" required>

                </fieldset>

                <fieldset>

                    <label for="quantidade_atual">Quantidade Atual</label>

                    <input id="quantidade_atual" name="quantidade_atual" type="number" placeholder="Quantidade"
                        required>

                </fieldset>

                <fieldset>

                    <button id="cancelarMat" type="button">
                        Cancelar
                    </button>

                    <button id="salvarMat" type="submit" style="color:white; background-color:#A71E1E; border:none;">

                        Alocar materiais

                    </button>

                </fieldset>

            </form>

            <div class="output">

                <h3>Recursos alocados</h3>

                <table id="alocacaoTable">

                    <thead>

                        <tr>

                            <th>Projeto</th>

                            <th>Recursos</th>

                            <th>Ações</th>

                        </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.concat.min.js"></script>

    <script>

        $(document).ready(function () {

            $('#sidebarCollapse').on('click', function () {

                $('#sidebar, #content').toggleClass('active');

                $('.collapse.in').toggleClass('in');

                $('a[aria-expanded=true]').attr('aria-expanded', 'false');

            });

            $('#organizadores').select2({
                placeholder: "Selecione organizadores",
                width: "100%"
            });

            $('#materiais').select2({
                placeholder: "Selecione materiais",
                width: "100%"
            });

        });

    </script>

</body>

</html>
