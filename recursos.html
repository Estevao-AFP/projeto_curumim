<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Gerenciar Doações</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style_sidebar.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.css">

    <script src="js/script.js"></script>
</head>

<body>

    <div class="wrapper">

        <nav id="sidebar">

            <div class="sidebar-header">
                <img class="logo" src="img/download-removebg-preview.png" alt="">
                <h3>Projeto Curumim</h3>
            </div>

            <ul class="list-unstyled components">

                <p>Navegar>>></p>

                <li>
                    <a href="index.html">Página inicial</a>
                </li>

                <li>
                    <a href="doar.html">Doar agora</a>
                </li>

                <li>
                    <a href="projetos.html">Cadastrar projetos</a>
                </li>

                <li>
                    <a href="organizadores.html">Cadastrar organizadores</a>
                </li>

                <li class="active">
                    <a href="recursos.html">Cadastrar recursos</a>
                </li>

                <li>
                    <a href="alocacao.html">Alocar recursos e organizadores</a>
                </li>

                <li>
                    <a href="doacoes.html">Gerenciar doações</a>
                </li>

            </ul>

        </nav>

        <div id="content">

            <nav class="navbar navbar-default">

                <div class="container-fluid navbar-flex">

                    <button type="button"
                        id="sidebarCollapse"
                        class="btn btn-info navbar-btn"
                        style="background-color:#A71E1E; border:none;">

                        <i class="glyphicon glyphicon-align-left"></i>

                    </button>

                    <div class="btn-centro">

                        <button
                            style="background-color:transparent; border:none; font-size:18px; color:#A71E1E; font-weight:bold;">

                            Cadastrar novo recurso

                        </button>

                    </div>

                    <div class="nav-direita">
                        <img class="logo" src="img/download-removebg-preview.png" alt="">
                    </div>

                </div>

            </nav>

            <form>

                <h4 style="font-weight:bold;">Novo recurso</h4>

                <fieldset>
                    <label for="nome_recurso">Descrição do recurso</label>

                    <input id="nome_recurso"
                        name="nome_recurso"
                        type="text"
                        placeholder="Descrição"
                        required>
                </fieldset>

                <fieldset>

                    <button id="btn_cancelar">
                        Cancelar
                    </button>

                    <button id="btn_salvar"
                        style="color:white; background-color:#A71E1E; border:none;">

                        Salvar Recurso

                    </button>

                </fieldset>

            </form>

            <div class="output">

                <h3>Recursos cadastrados</h3>

                <table id="projetoTable">

                    <thead>

                        <tr>
                            <th>Descrição do Recurso</th>
                            <th>Ações</th>
                        </tr>

                    </thead>

                    <tbody></tbody>

                </table>

            </div>

        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.concat.min.js"></script>

    <script>

        $(document).ready(function () {

            $('#sidebarCollapse').on('click', function () {

                $('#sidebar, #content').toggleClass('active');

                $('.collapse.in').toggleClass('in');

                $('a[aria-expanded=true]').attr('aria-expanded', 'false');

            });

        });

    </script>

</body>

</html>
