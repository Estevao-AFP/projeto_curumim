<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/styleIndex.css">

    <script src="js/scriptIndex.js"></script>
    <script src="js/cardFlip.js"></script>
</head>

<body>

    <div class="wrapper">
        <nav id="sidebar">
            <div class="sidebar-header">
                <img class="logo" src="img/download-removebg-preview.png" alt="">
                <h3>Projeto Curumim</h3>
            </div>

            <ul class="list-unstyled components">
                <p>Navegar>>></p>
                <li class="active">
                    <a href="index.html">Página inicial</a>
                </li>
                <li>
                    <a href="doar.html">Doar agora</a>
                </li>
                <li>
                    <a href="projetos.html">Cadastrar projetos</a>
                </li>
                <li>
                    <a href="organizadores.html">Cadastrar organizadores</a>
                </li>
                <li>
                    <a href="materiais.html">Cadastrar materiais </a>
                </li>
                <li>
                    <a href="alocacao.html">Alocar recursos</a>
                </li>
                <!-- <li>
                    <a href="doacoes.html">Gerenciar doações </a>
                </li> -->
            </ul>
        </nav>

        <div id="content">
            <nav class="navbar navbar-default">
                <div class="container-fluid navbar-flex">
                    <button type="button" id="sidebarCollapse" class="btn btn-info navbar-btn" style="background-color:#A71E1E; border: none;">
                        <i class="glyphicon glyphicon-align-left"></i>
                    </button>

                    <div class="btn-centro">
                        <button style="background-color:transparent; border: none; font-size: 18px; color: #A71E1E; font-weight: bold;">
                            Dashboard Doações
                        </button>
                    </div>

                    <div class="nav-direita">
                        <img class="logo" src="img/download-removebg-preview.png" alt="">
                    </div>
                </div>
            </nav>

            <div class="projetos-container">
                <h1>Nossos projetos</h1>
                <p>Conheça nossos projetos e como você pode contribuir para eles.</p>

                <fieldset class="filtros">
                    <div class="pesquisa-box">
                        <i class="glyphicon glyphicon-search"></i>
                        <input type="text" id="inputPesquisa" placeholder="Pesquisar projetos...">
                    </div>

                    <select name="filtroStatus" id="filtroStatus">
                        <option value="">Filtrar por status</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </fieldset>
            </div>

            <div class="projetos-cards" id="containerProjetos">
                </div>

        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.concat.min.js"></script>

    <script type="text/javascript">
        $(document).ready(function () {
            // Controle da Sidebar
            $('#sidebarCollapse').on('click', function () {
                $('#sidebar, #content').toggleClass('active');
                $('.collapse.in').toggleClass('in');
                $('a[aria-expanded=true]').attr('aria-expanded', 'false');
            });

            // Adiciona ouvintes de eventos para pesquisa e filtro em tempo real
            $('#inputPesquisa').on('input', aplicarFiltros);
            $('#filtroStatus').on('change', aplicarFiltros);

            // Carregar os projetos ao iniciar a página aplicando os filtros vazios iniciais
            aplicarFiltros();
        });

        // Função responsável por ler os filtros e decidir o que exibir
        function aplicarFiltros() {
            const termoPesquisa = $('#inputPesquisa').val().toLowerCase();
            const statusSelecionado = $('#filtroStatus').val().toLowerCase();
            
            const todosProjetos = JSON.parse(localStorage.getItem("projetos")) || [];

            // Filtra o array original baseado nos dois campos
            const projetosFiltrados = todosProjetos.filter(projeto => {
                const nomeOuDescricaoMatch = projeto.nome.toLowerCase().includes(termoPesquisa) || 
                                             projeto.descricao.toLowerCase().includes(termoPesquisa);
                
                const statusMatch = statusSelecionado === "" || projeto.status.toLowerCase() === statusSelecionado;

                return nomeOuDescricaoMatch && statusMatch;
            });

            // Envia apenas a lista filtrada para criar os cards
            renderizarCards(projetosFiltrados);
        }

        // Função dedicada apenas a montar o HTML na tela
        function renderizarCards(projetos) {
            const organizadores = JSON.parse(localStorage.getItem("organizadores")) || [];
            const container = document.getElementById("containerProjetos");

            container.innerHTML = "";

            if (projetos.length === 0) {
                container.innerHTML = "<p style='padding: 20px; font-weight: bold; color: #A71E1E;'>Nenhum projeto encontrado com esses filtros.</p>";
                return;
            }

            projetos.forEach(projeto => {
                let nomesOrgs = "Não informado";
                if (projeto.organizadores && projeto.organizadores.length > 0) {
                    nomesOrgs = projeto.organizadores.map(id => {
                        const org = organizadores.find(o => o.id == id);
                        return org ? org.nome : "Removido";
                    }).join(", ");
                }

                const formatarData = (dataStr) => {
                    if (!dataStr) return "Indefinido";
                    const partes = dataStr.split("-");
                    return partes.length === 3 ? `${partes[2]}/${partes[1]}/${partes[0]}` : dataStr;
                };

                const card = document.createElement("div");
                card.className = "card-projeto";
                card.setAttribute("data-id", projeto.id);

                card.innerHTML = `
                    <div class="card-conteudo">
                        <div class="cabecalho-card">
                            <div class="titulo-status">
                                <h2>${projeto.nome}</h2>
                                <span class="status ${projeto.status.toLowerCase()}">${projeto.status}</span>
                            </div>
                            <p>${projeto.descricao}</p>
                        </div>

                        <div class="infosProjeto">
                            <div class="info">
                                <span>Público</span>
                                <strong>${projeto.faixaEtaria} anos</strong>
                            </div>
                            <div class="info">
                                <span>Organizadores</span>
                                <strong>${nomesOrgs}</strong>
                            </div>
                            <div class="info">
                                <span>Início</span>
                                <strong>${formatarData(projeto.inicio)}</strong>
                            </div>
                            <div class="info">
                                <span>Término</span>
                                <strong>${formatarData(projeto.termino)}</strong>
                            </div>
                        </div>
                    </div>

                    <div class="acoes-card">
                        <button type="button" onclick="location.href='doar.html'" class="btn-doar">
                            Doar agora
                        </button>
                    </div>
                `;

                container.appendChild(card);
            });
        }
    </script>
</body>

</html>
