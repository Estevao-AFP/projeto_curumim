<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Doe agora!</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <link rel="stylesheet" href="css/style_sidebar.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/styleDoacao.css">
    
    <script src="js/scriptDoar.js"></script>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.min.css">
</head>

<body>

    <div class="wrapper">

        <nav id="sidebar">

            <div class="sidebar-header">
                <img class="logo" src="img/download-removebg-preview.png" alt="">
                <h3>Projeto Curumim</h3>
            </div>

            <ul class="list-unstyled components">
                <p>Navegar>>></p>

                <li>
                    <a href="index.html">Página inicial</a>
                </li>

                <li class="active">
                    <a href="doar.html">Doar agora</a>
                </li>

                <li>
                    <a href="projetos.html">Cadastrar projetos</a>
                </li>

                <li>
                    <a href="organizadores.html">Cadastrar organizadores</a>
                </li>

                <li>
                    <a href="materiais.html">Cadastrar materiais</a>
                </li>

                <li>
                    <a href="alocacao.html">Alocar recursos</a>
                </li>

                <!-- <li>
                    <a href="doacoes.html">Gerenciar doações</a>
                </li> -->
            </ul>

        </nav>

        <div id="content">

            <nav class="navbar navbar-default">

                <div class="container-fluid navbar-flex">

                    <button type="button" id="sidebarCollapse" class="btn btn-info navbar-btn"
                        style="background-color:#A71E1E; border:none;">

                        <i class="glyphicon glyphicon-align-left"></i>

                    </button>

                    <div class="btn-centro">
                        <button
                            style="background-color:transparent; border:none; font-size:18px; color:#A71E1E; font-weight:bold;">
                            Dashboard Doações
                        </button>
                    </div>

                    <div class="nav-direita">
                        <img class="logo" src="img/download-removebg-preview.png" alt="">
                    </div>

                </div>

            </nav>

            <form id="formDoacao">

                <h4 style="font-weight:bold;">Doação</h4>

                <fieldset>

                    <label>Tipo de doação</label>

                    <div class="faixa">
                        <button type="button" class="tipo-btn active" data-tipo="financeira">
                            Financeira
                        </button>

                        <button type="button" class="tipo-btn" data-tipo="material">
                            Material
                        </button>
                    </div>

                </fieldset>

                <fieldset id="areaValor">

                    <label for="valorDoacao">Valor da doação</label>

                    <div class="input-valor">
                        <span>R$</span>
                        <input id="valorDoacao" type="number" placeholder="0,00">
                    </div>

                </fieldset>

                <fieldset>

                    <label>Destino da doação</label>

                    <div class="faixa">

                        <button type="button" class="destino-card active" data-destino="projeto">
                            Projeto específico
                        </button>

                        <button type="button" class="destino-card" data-destino="geral">
                            Curumim
                        </button>

                    </div>

                </fieldset>

                <fieldset id="campoProjeto">

                    <label>Projeto</label>

                    <select id="projeto">
                        <option>Escolha um projeto</option>
                        <option>Artesanato</option>
                        <option>Cuido de Mim</option>
                        <option>Gerações</option>
                    </select>

                </fieldset>

                <fieldset id="campoMaterial" class="escondido">

                    <label>Recurso / Material</label>

                    <select id="material">
                        <option>Escolha um recurso</option>
                        <option>Material escolar</option>
                        <option>Livros</option>
                        <option>Brinquedos</option>
                        <option>Equipamentos esportivos</option>
                        <option>Roupas</option>
                        <option>Alimentos</option>
                    </select>

                </fieldset>

                <fieldset id="areaPagamento">

                    <label>Forma de pagamento</label>

                    <div class="pix-box">
                        PIX
                    </div>

                </fieldset>

                <fieldset id="resumoDoacao">

                    <label>Resumo</label>

                    <div class="resumo-box">
                        <span>Total:</span>
                        <strong id="valorResumo">R$ 0,00</strong>
                    </div>

                </fieldset>

                <fieldset id="areaBotao">

                    <button id="btn_salvar"
                        style="background:#A71E1E;color:white;border:none;padding:10px 20px;border-radius:8px;">
                        Finalizar doação
                    </button>

                </fieldset>

                <fieldset id="instrucoesMaterial" class="escondido">

                    <label>Como doar materiais?</label>

                    <div class="info-material">
                        <p>Leve o material até a unidade Curumim mais próxima.</p>
                        <p>Identifique os itens para facilitar a triagem.</p>
                    </div>

                </fieldset>

            </form>

        </div>

    </div>

    <script src="js/script.js"></script>
    <script src="js/scriptDoacao.js"></script>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/malihu-custom-scrollbar-plugin/3.1.5/jquery.mCustomScrollbar.concat.min.js"></script>

    <script>

        $(document).ready(function () {

            $('#sidebarCollapse').on('click', function () {

                $('#sidebar, #content').toggleClass('active');

                $('.collapse.in').toggleClass('in');

                $('a[aria-expanded=true]').attr('aria-expanded', 'false');

            });

        });

    </script>

</body>

</html>
